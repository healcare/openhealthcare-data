name: Validate directory data

on:
  pull_request:
    paths:
      - "data/directories/**/*.json"
      - "schemas/**"
      - "templates/**"
      - "scripts/validate-bundles.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "data/directories/**/*.json"
      - "schemas/**"
      - "templates/**"
      - "scripts/validate-bundles.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate changed bundles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/validate-bundles.mjs
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA")
          for file in "${changed[@]}"; do
            case "$file" in
              schemas/*|templates/*|scripts/validate-bundles.mjs|package.json)
                node scripts/validate-bundles.mjs
                exit 0
                ;;
            esac
          done

          bundles=()
          for file in "${changed[@]}"; do
            if [[ "$file" == data/directories/*.json || "$file" == data/directories/**/*.json ]]; then
              bundles+=("$file")
            fi
          done

          if (( ${#bundles[@]} == 0 )); then
            echo "No directory bundles changed."
            exit 0
          fi

          node scripts/validate-bundles.mjs "${bundles[@]}"
